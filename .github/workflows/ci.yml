name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Pull requests from Dependabot (and from forks) receive no Actions secrets. The throwaway SQL
    # Server then uses a password derived from the run: it lives only on this runner, for this job.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.CI_MSSQL_SA_PASSWORD || format('Ci-{0}-{1}-aA', github.run_id, github.run_attempt) }}
        ports:
          - 1433:1433
    env:
      AUTHCENTER_RELATIONAL_TEST_CONNECTION: "Server=localhost,1433;User Id=sa;Password=${{ secrets.CI_MSSQL_SA_PASSWORD || format('Ci-{0}-{1}-aA', github.run_id, github.run_attempt) }};TrustServerCertificate=true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan tracked source for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory /tmp gitleaks
          /tmp/gitleaks dir . --redact=100 --no-banner --no-color --max-target-megabytes 50

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            src/AuthCenter.Admin/package-lock.json
            tests/AuthCenter.HostedUi.Tests/package-lock.json

      - name: Restore dependencies
        run: dotnet restore

      # dotnet-ef and ReportGenerator, pinned in .config/dotnet-tools.json.
      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Wait for SQL Server
        shell: bash
        run: |
          for attempt in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Admin frontend quality gates
        working-directory: src/AuthCenter.Admin
        run: npm ci && npm audit --audit-level=high && npm run lint && npm run typecheck && npm run test:coverage && npm run build && npm run budget

      - name: Install admin E2E browser
        working-directory: src/AuthCenter.Admin
        run: npx playwright install --with-deps chromium

      - name: Admin frontend E2E and accessibility
        working-directory: src/AuthCenter.Admin
        run: npm run test:e2e

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Every model change ships with its migration.
      - name: Check the EF Core model against the migrations
        run: dotnet ef migrations has-pending-model-changes --no-build --configuration Release --project src/AuthCenter.Infrastructure --startup-project src/AuthCenter.Api

      # Production applies migrations out of band, before the deployment
      # (docs/operations/OWNER-ACTIONS.md, OPS-03): this is the idempotent script of this commit.
      # sqlcmd starts with QUOTED_IDENTIFIER OFF, and SQL Server then rejects every change to a table
      # with a filtered index (AspNetUsers has several): the script sets it first, for any client.
      - name: Generate the database migration script
        shell: bash
        run: |
          dotnet ef migrations script --idempotent --no-build --configuration Release --project src/AuthCenter.Infrastructure --startup-project src/AuthCenter.Api --output "${{ runner.temp }}/ef-migrations.sql"
          mkdir -p "${{ runner.temp }}/database-migrations"
          { printf 'SET ANSI_NULLS ON;\nSET QUOTED_IDENTIFIER ON;\nGO\n\n'; sed '1s/^\xEF\xBB\xBF//' "${{ runner.temp }}/ef-migrations.sql"; } > "${{ runner.temp }}/database-migrations/migrations.sql"

      - name: Upload the database migration script
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-migrations
          path: ${{ runner.temp }}/database-migrations/migrations.sql
          if-no-files-found: error
          retention-days: 30

      - name: Test
        run: >-
          dotnet test --configuration Release --no-build --verbosity normal
          --settings coverlet.runsettings --collect:"XPlat Code Coverage"
          --results-directory "${{ runner.temp }}/coverage"

      # Merges the unit and integration coverage into the run summary and fails under 80% of lines
      # or 60% of branches (85% and 64% when the gate was introduced). The console enforces its own
      # minimums in vite.config.ts.
      - name: Coverage report and gate
        shell: bash
        run: |
          dotnet reportgenerator -reports:"${{ runner.temp }}/coverage/**/coverage.cobertura.xml" \
            -targetdir:"${{ runner.temp }}/coverage-report/dotnet" \
            -reporttypes:"Cobertura;HtmlSummary;MarkdownSummaryGithub"
          cp -r src/AuthCenter.Admin/coverage "${{ runner.temp }}/coverage-report/console"
          cat "${{ runner.temp }}/coverage-report/dotnet/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci/coverage-gate.py "${{ runner.temp }}/coverage-report/dotnet/Cobertura.xml" 80 60

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-report
          if-no-files-found: ignore
          retention-days: 7

      - name: OIDC and SCIM conformance profile
        run: dotnet test tests/AuthCenter.IntegrationTests/AuthCenter.IntegrationTests.csproj --configuration Release --no-build --filter Category=Conformance --verbosity normal

      - name: TypeScript SDK
        working-directory: sdk/typescript
        run: npm ci && npm test

      - name: Hosted UI unit tests
        working-directory: tests/AuthCenter.HostedUi.Tests
        run: npm ci && npm test

      # The login, portal and emailed-link pages against the Release API, SQL Server and Chromium
      # (browser installed by the admin E2E step; same Playwright version).
      - name: Hosted UI end-to-end
        working-directory: tests/AuthCenter.HostedUi.Tests
        run: npx playwright test

      - name: Upload hosted UI end-to-end report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-ui-e2e-report
          path: |
            tests/AuthCenter.HostedUi.Tests/playwright-report
            tests/AuthCenter.HostedUi.Tests/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Pack .NET integration SDK
        run: dotnet pack sdk/dotnet/AuthCenter.Client/AuthCenter.Client.csproj --configuration Release --no-build --output "${{ runner.temp }}/sdk-packages"

      - name: Upload .NET integration SDK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authcenter-dotnet-sdk
          path: ${{ runner.temp }}/sdk-packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: SPA quickstart
        working-directory: samples/spa
        run: npm ci && npm run build

      - name: Audit vulnerable dependencies
        run: dotnet list package --vulnerable --include-transitive

      - name: Publish deployment artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: dotnet publish src/AuthCenter.Api/AuthCenter.Api.csproj --configuration Release --no-build -p:SkipAdminFrontendBuild=true --output "${{ runner.temp }}/authcenter-publish"

      - name: Upload deployment artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authcenter-app
          path: ${{ runner.temp }}/authcenter-publish
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_SLOT: ${{ vars.AZURE_WEBAPP_SLOT }}
        run: |
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$AZURE_WEBAPP_NAME"
          test -n "$AZURE_WEBAPP_SLOT"

      - name: Download deployment artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: authcenter-app
          path: app

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT }}
          package: app

      - name: Verify deployment health
        shell: bash
        env:
          APP_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        run: |
          for attempt in {1..18}; do
            live_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 20 "${APP_URL%/}/health/live" || true)"
            ready_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 20 "${APP_URL%/}/health/ready" || true)"
            branding_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 20 "${APP_URL%/}/api/applications/branding/AUTHCENTER" || true)"
            if [ "$live_status" = "200" ] && [ "$ready_status" = "200" ] && [ "$branding_status" = "200" ]; then
              break
            fi
            echo "Deployment check ${attempt}/18 returned live=${live_status:-unreachable}, ready=${ready_status:-unreachable}, branding=${branding_status:-unreachable}."
            if [ "$attempt" = "18" ]; then
              echo "The deployment completed, but required runtime checks did not become healthy." >&2
              # Names the failing readiness check; "database-schema" means migrations are pending (OPS-03).
              curl --silent --show-error --max-time 20 "${APP_URL%/}/health/ready" >&2 || true
              exit 1
            fi
            sleep 10
          done

          for ui_path in login portal login.html portal.html reset-password magic-link admin-v2/; do
            headers="$(curl --silent --show-error --dump-header - --output /dev/null \
              --max-time 20 "${APP_URL%/}/${ui_path}")"
            if ! grep --quiet --ignore-case '^content-type: text/html' <<< "$headers"; then
              echo "The ${ui_path} UI document is not served as text/html." >&2
              exit 1
            fi
            if ! grep --quiet --ignore-case '^content-security-policy:' <<< "$headers"; then
              echo "The ${ui_path} UI document is missing Content-Security-Policy." >&2
              exit 1
            fi
          done

          # The retired /admin console redirects to the current one.
          admin_redirect="$(curl --silent --show-error --output /dev/null --write-out '%{http_code} %{redirect_url}' --max-time 20 "${APP_URL%/}/admin")"
          if [ "${admin_redirect%% *}" != "302" ] || [[ "${admin_redirect#* }" != */admin-v2/ ]]; then
            echo "The retired /admin console does not redirect to /admin-v2/ (${admin_redirect})." >&2
            exit 1
          fi

          admin_v2_html="$(curl --fail --silent --show-error --max-time 20 "${APP_URL%/}/admin-v2/")"
          admin_v2_asset="$(grep --only-matching --max-count=1 '/admin-v2/assets/[^\" ]*\.js' <<< "$admin_v2_html")"
          if [ -z "$admin_v2_asset" ]; then
            echo "The admin-v2 document does not reference a hashed JavaScript asset." >&2
            exit 1
          fi
          asset_headers="$(curl --fail --silent --show-error --compressed --header 'Accept-Encoding: br, gzip' --dump-header - --output /dev/null --max-time 20 "${APP_URL%/}${admin_v2_asset}")"
          if ! grep --quiet --ignore-case '^cache-control: .*immutable' <<< "$asset_headers"; then
            echo "The admin-v2 asset is not served with immutable caching." >&2
            exit 1
          fi
          if ! grep --quiet --ignore-case '^content-encoding: \(br\|gzip\)' <<< "$asset_headers"; then
            echo "The admin-v2 asset is not served with Brotli or Gzip compression." >&2
            exit 1
          fi
