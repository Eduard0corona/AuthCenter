name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.CI_MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
    env:
      AUTHCENTER_RELATIONAL_TEST_CONNECTION: "Server=localhost,1433;User Id=sa;Password=${{ secrets.CI_MSSQL_SA_PASSWORD }};TrustServerCertificate=true"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Scan tracked source for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory /tmp gitleaks
          /tmp/gitleaks dir . --redact=100 --no-banner --no-color --max-target-megabytes 50

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Wait for SQL Server
        shell: bash
        run: |
          for attempt in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: OIDC and SCIM conformance profile
        run: dotnet test tests/AuthCenter.IntegrationTests/AuthCenter.IntegrationTests.csproj --configuration Release --no-build --filter Category=Conformance --verbosity normal

      - name: TypeScript SDK
        working-directory: sdk/typescript
        run: npm ci && npm test

      - name: Pack .NET integration SDK
        run: dotnet pack sdk/dotnet/AuthCenter.Client/AuthCenter.Client.csproj --configuration Release --no-build --output "${{ runner.temp }}/sdk-packages"

      - name: Upload .NET integration SDK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authcenter-dotnet-sdk
          path: ${{ runner.temp }}/sdk-packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: SPA quickstart
        working-directory: samples/spa
        run: npm ci && npm run build

      - name: Audit vulnerable dependencies
        run: dotnet list package --vulnerable --include-transitive

      - name: Publish deployment artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: dotnet publish src/AuthCenter.Api/AuthCenter.Api.csproj --configuration Release --no-build --output "${{ runner.temp }}/authcenter-publish"

      - name: Upload deployment artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authcenter-app
          path: ${{ runner.temp }}/authcenter-publish
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_SLOT: ${{ vars.AZURE_WEBAPP_SLOT }}
        run: |
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          test -n "$AZURE_WEBAPP_NAME"
          test -n "$AZURE_WEBAPP_SLOT"

      - name: Download deployment artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: authcenter-app
          path: app

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        id: deploy-to-webapp
        uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6 # v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT }}
          package: app

      - name: Verify deployment health
        shell: bash
        env:
          APP_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        run: |
          for attempt in {1..18}; do
            live_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 20 "${APP_URL%/}/health/live" || true)"
            ready_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 20 "${APP_URL%/}/health/ready" || true)"
            branding_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 20 "${APP_URL%/}/api/applications/branding/AUTHCENTER" || true)"
            if [ "$live_status" = "200" ] && [ "$ready_status" = "200" ] && [ "$branding_status" = "200" ]; then
              break
            fi
            echo "Deployment check ${attempt}/18 returned live=${live_status:-unreachable}, ready=${ready_status:-unreachable}, branding=${branding_status:-unreachable}."
            if [ "$attempt" = "18" ]; then
              echo "The deployment completed, but required runtime checks did not become healthy." >&2
              exit 1
            fi
            sleep 10
          done

          for ui_path in login portal admin login.html portal.html admin.html; do
            headers="$(curl --silent --show-error --dump-header - --output /dev/null \
              --max-time 20 "${APP_URL%/}/${ui_path}")"
            if ! grep --quiet --ignore-case '^content-type: text/html' <<< "$headers"; then
              echo "The ${ui_path} UI document is not served as text/html." >&2
              exit 1
            fi
            if ! grep --quiet --ignore-case '^content-security-policy:' <<< "$headers"; then
              echo "The ${ui_path} UI document is missing Content-Security-Policy." >&2
              exit 1
            fi
          done
