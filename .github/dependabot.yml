# Weekly dependency updates: minor and patch versions are grouped per ecosystem, so each week brings
# one pull request per area, and majors come alone. Security updates open as soon as an advisory is
# published, whatever this schedule says (enable them in Settings → Code security).
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # These families move with the target framework (net10.0, and net8.0 in the client SDK), in
      # a deliberate upgrade: a new major only builds for the new framework.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directories: ["/src/AuthCenter.Admin", "/sdk/typescript", "/samples/spa", "/tests/AuthCenter.HostedUi.Tests"]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*dotnet/*"
        update-types: ["version-update:semver-major"]
