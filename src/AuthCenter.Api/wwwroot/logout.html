<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Cerrar sesión</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/logout.js"></script>
</head>
<body>
  <main id="main" class="auth-shell">
    <section class="auth-panel" aria-labelledby="page-title">
      <div id="brand" class="brand" hidden>
        <img id="brand-logo" alt="" hidden>
        <strong id="brand-name"></strong>
      </div>
      <div class="page-header">
        <h1 id="page-title" tabindex="-1">Cerrar sesión</h1>
        <p id="logout-description" class="muted">Comprobando tu sesión…</p>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="logout-actions" class="actions" hidden>
        <button id="logout-confirm" type="button">Cerrar sesión</button>
        <button id="logout-cancel" class="secondary" type="button">Seguir conectado</button>
      </div>
      <p id="sign-in" hidden><a class="button" href="/login">Iniciar sesión</a></p>
      <nav id="legal" class="actions" aria-label="Enlaces legales"></nav>
    </section>
  </main>
</body>
</html>
