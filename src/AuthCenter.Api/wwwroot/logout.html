<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Cerrar sesión · AuthCenter</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/logout.js"></script>
</head>
<body>
  <main id="main" class="auth-shell">
    <section class="auth-panel" aria-labelledby="page-title">
      <div class="brand">
        <div>
          <strong>AuthCenter</strong>
          <div class="muted">Identidad segura para tus aplicaciones</div>
        </div>
      </div>
      <div>
        <h1 id="page-title">Cerrar sesión</h1>
        <p id="logout-description" class="muted">¿Quieres cerrar tu sesión en AuthCenter?</p>
      </div>
      <div id="logout-actions" class="actions" hidden>
        <button id="logout-confirm" type="button">Cerrar sesión</button>
        <button id="logout-cancel" class="secondary" type="button">Seguir conectado</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
