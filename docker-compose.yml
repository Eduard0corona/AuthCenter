services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      # The API cannot migrate until the server actually accepts logins, which is well after the
      # container reports as started.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
    depends_on:
      sql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=AuthCenter;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      Jwt__RsaPrivateKeyPem: ${JWT_RSA_PRIVATE_KEY_PEM:?set JWT_RSA_PRIVATE_KEY_PEM in .env}
      Mfa__EncryptionKey: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY in .env}
      ActionLinks__DefaultBaseUrl: ${ACTION_LINKS_BASE_URL:-http://localhost:3000}
      Oidc__PublicOrigin: ${OIDC_PUBLIC_ORIGIN:-http://localhost:8080}
      ForwardedHeaders__Enabled: "false"
      DataProtection__ApplicationName: "AuthCenter.Compose"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:5173"
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@example.com}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
      Seed__AdminFullName: ${SEED_ADMIN_FULL_NAME:-System Administrator}
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  sql-data:
